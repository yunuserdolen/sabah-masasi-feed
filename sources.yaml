# ─────────────────────────────────────────────────────────────────────
# SABAH MASASI — KATMAN 1 KAYNAK LİSTESİ
#
# type: rss   → doğrudan RSS/Atom adresi (url)
# type: gnews → Google News RSS araması (q). RSS'i olmayan yayınlar için
#               "site:alanadi when:1d", konu taramaları için anahtar kelime.
# leaning (eğilim) kodları — kaba etiketlerdir, dilediğin gibi düzelt:
#   sol, msol (merkez-sol), liberal, merkez, msag (merkez-sağ), sag,
#   ulusalci, hukumet (hükümete yakın), devlet (devlet ajansı/fonlu),
#   kamu (kamu yayıncısı), bagimsiz, karisik (konu taraması, çok kaynak)
#
# NOT: Adreslerin bir kısmı zamanla değişir. Her çalışmadan sonra
# health.json'da (ve MCP'deki feed_health aracında) çalışmayanlar listelenir.
# ─────────────────────────────────────────────────────────────────────

settings:
  tz_offset_hours: 3              # İstanbul (UTC+3, yaz saati yok)
  retention_days: 9               # Cuma'nın 7 günlük geri bakışı için
  max_items_per_feed_per_day: 15  # kaynak başına günlük tavan (denge + boyut)
  summary_chars: 160
  request_timeout: 20

# Hangi bölüm hangi gün digest'e girer (1=Pzt … 5=Cum).
# Bu tablo promptundaki takvimi aynalar; prompt değişirse burayı güncelle.
schedule:
  turkiye:             {days: [1, 2, 3, 4, 5]}
  koseyazarlari:       {days: [1, 2, 3, 4, 5]}   # geniş tarama Pzt/Per — derinlik promptta
  dunya:               {days: [1, 2, 3, 4, 5]}
  hukuk:               {days: [1, 2, 3, 4, 5]}
  fikir:               {days: [1, 2, 3, 4, 5]}
  secim_abd:           {days: [3], until: "2026-11-30", lookback_days: 7}
  secim_israil:        {days: [3], until: "2026-11-30", lookback_days: 7}
  secim_fransa:        {days: [3], until: "2026-11-30", lookback_days: 7}
  secim_brezilya:      {days: [3], until: "2026-11-30", lookback_days: 7}
  abd_sol:             {days: [4], lookback_days: 7}
  teknoloji_guc:       {days: [4], lookback_days: 7}
  dusunce_kuruluslari: {days: [5], lookback_days: 7}
  kultur:              {days: [5], lookback_days: 7}
  istanbul:            {days: [5], lookback_days: 7}
  turkiye_dis_basin:   {days: [5], lookback_days: 7}

gnews_locales:
  tr: {hl: tr, gl: TR, ceid: "TR:tr"}
  en: {hl: en-US, gl: US, ceid: "US:en"}
  fr: {hl: fr, gl: FR, ceid: "FR:fr"}
  de: {hl: de, gl: DE, ceid: "DE:de"}
  es: {hl: es, gl: ES, ceid: "ES:es"}
  ar: {hl: ar, gl: EG, ceid: "EG:ar"}
  zh: {hl: zh-CN, gl: CN, ceid: "CN:zh-Hans"}
  he: {hl: iw, gl: IL, ceid: "IL:iw"}

