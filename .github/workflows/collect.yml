
Collect · YML
name: sabah-masasi-collect
 
on:
  schedule:
    - cron: "15 */2 * * *"     # her 2 saatte bir
    - cron: "30 2 * * 1-5"     # hafta içi 05:30 İstanbul — 06:00 kesiminden önce taze veri
  workflow_dispatch:
 
permissions:
  contents: write
 
concurrency:
  group: sabah-masasi-collect
  cancel-in-progress: false
 
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
 
      - run: pip install -r collector/requirements.txt
 
      # Önceki günlük parçaları "data" dalından geri yükle (birikimli tarama).
      - name: Önceki veriyi al
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            git archive FETCH_HEAD | tar -x -C data
          fi
 
      - run: python collector/collect.py
 
      # "data" dalını tek commit olarak zorla yaz: geçmiş birikmez, repo şişmez.
      - name: Veriyi yayınla
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd data
          git init -q -b data
          git add -A
          git -c user.name="sabah-bot" -c user.email="actions@users.noreply.github.com" \
              commit -qm "feed $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
 
